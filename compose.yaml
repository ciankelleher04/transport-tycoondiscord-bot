services:
  bot:
    build: .
    container_name: transport-tycoon-bot
    restart: "no"
    env_file:
      - .env
    volumes:
      - ./data:/data

  stats-web:
    build:
      context: .
      dockerfile: Dockerfile.web
    container_name: tt-tools-stats-web
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./data:/data
    ports:
      - "3000:3000"

  glance:
    image: glanceapp/glance:latest
    container_name: glance
    restart: unless-stopped
    env_file:
      - ./glance/secrets.env
    ports:
      - "8080:8080"
    volumes:
      - ./glance/glance.yml:/app/config/glance.yml:ro
